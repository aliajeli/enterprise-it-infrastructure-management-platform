name: Platform validation

on:
  push:
    branches:
      - "phase3/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: Web validation (Node.js 26)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify dependency tree
        run: npm ls --all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload generated lockfile for initial bootstrap
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
