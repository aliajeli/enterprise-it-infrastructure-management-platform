name: Platform validation

on:
  push:
    branches:
      - "phase3/**"
  pull_request:
    branches:
      - main
      - "phase3/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-validation:
    name: Platform validation (Node.js 26 / PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_test_password
          POSTGRES_DB: platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://platform:platform_test_password@127.0.0.1:5432/platform_test?schema=public
      API_HOST: 127.0.0.1
      API_PORT: 13001
      PUBLIC_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Verify patched Effect resolution
        run: |
          node -e 'const lock = require("./package-lock.json"); const actual = lock.packages?.["node_modules/effect"]?.version; if (actual !== "3.22.1") { console.error("Expected effect@3.22.1, found " + String(actual)); process.exit(1); }'

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate:deploy

      - name: Verify dependency tree
        run: npm ls --all

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PostgreSQL backup and restore smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=platform_test_password
          pg_dump -h 127.0.0.1 -U platform -d platform_test --format=custom --no-owner --no-privileges --file="$RUNNER_TEMP/platform-m1.dump"
          createdb -h 127.0.0.1 -U platform platform_restore_test
          pg_restore --host=127.0.0.1 --username=platform --exit-on-error --no-owner --no-privileges --dbname=platform_restore_test "$RUNNER_TEMP/platform-m1.dump"
          psql -h 127.0.0.1 -U platform -d platform_restore_test -Atqc 'SELECT (SELECT COUNT(*) FROM "users") > 0 AND (SELECT COUNT(*) FROM "branches") > 0 AND (SELECT COUNT(*) FROM "audit_events") > 0' | grep -qx t
          migration_count="$(psql -h 127.0.0.1 -U platform -d platform_restore_test -Atqc 'SELECT COUNT(*) FROM "_prisma_migrations" WHERE "finished_at" IS NOT NULL')"
          test "$migration_count" -gt 0
          dropdb -h 127.0.0.1 -U platform platform_restore_test
          rm -f "$RUNNER_TEMP/platform-m1.dump"

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload generated lockfile for initial bootstrap
        if: always() && hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-${{ github.run_id }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  windows-api-smoke:
    name: Windows API runtime smoke
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://platform:placeholder@127.0.0.1:5432/platform?schema=public
      API_HOST: 127.0.0.1
      API_PORT: 13001
      PUBLIC_ORIGIN: http://127.0.0.1:3000
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Windows API service host
        run: dotnet build apps/api/windows/service-host/EnterpriseIT.ApiServiceHost.csproj --configuration Release

      - name: Test Windows API service-host process lifecycle policy
        run: dotnet test apps/api/windows/service-host-tests/EnterpriseIT.ApiServiceHost.Tests.csproj --configuration Release

      - name: Build Windows DPAPI helper
        run: dotnet build apps/api/windows/dpapi-helper/CredentialVault.DpapiHelper.csproj --configuration Release

      - name: Verify DPAPI helper rejects non-service identity
        shell: pwsh
        run: |
          $dll = "apps/api/windows/dpapi-helper/bin/Release/net10.0-windows/CredentialVault.DpapiHelper.dll"
          $installation = [System.Text.Encoding]::UTF8.GetBytes("00000000-0000-4000-8000-000000000001")
          $key = [byte[]]::new(32)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($key)
          $body = [byte[]]::new(8 + $installation.Length + $key.Length)
          $body[0] = 1
          $body[1] = 1
          $body[2] = [byte](($installation.Length -shr 8) -band 255)
          $body[3] = [byte]($installation.Length -band 255)
          $body[4] = 0
          $body[5] = 0
          $body[6] = 0
          $body[7] = [byte]$key.Length
          [Array]::Copy($installation, 0, $body, 8, $installation.Length)
          [Array]::Copy($key, 0, $body, 8 + $installation.Length, $key.Length)
          $request = [byte[]]::new(4 + $body.Length)
          $request[0] = [byte](($body.Length -shr 24) -band 255)
          $request[1] = [byte](($body.Length -shr 16) -band 255)
          $request[2] = [byte](($body.Length -shr 8) -band 255)
          $request[3] = [byte]($body.Length -band 255)
          [Array]::Copy($body, 0, $request, 4, $body.Length)
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "dotnet"
          $start.ArgumentList.Add($dll)
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($start)
          $process.StandardInput.BaseStream.Write($request, 0, $request.Length)
          $process.StandardInput.Close()
          $responseStream = [System.IO.MemoryStream]::new()
          $process.StandardOutput.BaseStream.CopyTo($responseStream)
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          $response = $responseStream.ToArray()
          [Array]::Clear($key, 0, $key.Length)
          [Array]::Clear($body, 0, $body.Length)
          [Array]::Clear($request, 0, $request.Length)
          if ($process.ExitCode -eq 0 -or $response.Length -ne 9 -or $response[0] -ne 0 -or $response[1] -ne 0 -or $response[2] -ne 0 -or $response[3] -ne 5 -or $response[4] -ne 2 -or $response[5] -ne 0 -or $response[6] -ne 0 -or $response[7] -ne 0 -or $response[8] -ne 0 -or $stderr.Length -ne 0) {
            throw "DPAPI helper did not reject the unprovisioned process identity with the generic error response."
          }

      - name: Build Windows keyring storage helper
        run: dotnet build apps/api/windows/keyring-storage-helper/CredentialVault.KeyringStorageHelper.csproj --configuration Release

      - name: Verify unprovisioned keyring helper fails closed
        shell: pwsh
        run: |
          $dll = "apps/api/windows/keyring-storage-helper/bin/Release/net10.0-windows/CredentialVault.KeyringStorageHelper.dll"
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = "dotnet"
          $start.ArgumentList.Add($dll)
          $start.UseShellExecute = $false
          $start.RedirectStandardInput = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::Start($start)
          $request = [byte[]](1, 1, 0, 0, 0, 0)
          $process.StandardInput.BaseStream.Write($request, 0, $request.Length)
          $process.StandardInput.Close()
          $responseStream = [System.IO.MemoryStream]::new()
          $process.StandardOutput.BaseStream.CopyTo($responseStream)
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          $response = $responseStream.ToArray()
          if ($process.ExitCode -eq 0 -or $response.Length -ne 7 -or $response[0] -ne 1 -or $response[1] -ne 255 -or $response[2] -ne 0 -or $response[3] -ne 0 -or $response[4] -ne 0 -or $response[5] -ne 1 -or $response[6] -ne 1 -or $stderr.Length -ne 0) {
            throw "Unprovisioned keyring helper did not fail closed with the generic binary error contract."
          }

      - name: Test read-only installer host preflight
        shell: pwsh
        run: pwsh -NoProfile -File scripts/windows/test-installer-preflight.ps1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and compile Prisma database package
        run: npm run build --workspace @platform/database

      - name: Typecheck API and tests
        run: npm run typecheck --workspace @platform/api

      - name: Run API and Argon2id tests on Windows
        run: npm test --workspace @platform/api

      - name: Build API service
        run: npm run build --workspace @platform/api

  lockfile-bootstrap:
    name: Refresh npm dependency lockfile
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Checkout source without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Generate or refresh lockfile without executing package scripts
        run: npm update effect --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit and push lockfile when newly generated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Expected npm to generate package-lock.json, but the file is missing."
            exit 1
          fi
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Tracked lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          VERSION="$(node -p 'require("./package.json").version')"
          git commit -m "chore(deps): refresh lockfile for v${VERSION}"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH}" push origin "HEAD:${GITHUB_REF_NAME}"
